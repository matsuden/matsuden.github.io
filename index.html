<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

<body>

<section id="company" class="section light">

<section id="contact" class="section">

        <p>工事のご相談・お見積りはお気軽にご連絡ください。</p>
        <div class="contact-links">
            <a href="tel:08000000000" class="btn">電話する</a>
            <a href="mailto:info@example.com" class="btn sub">メールで問い合わせ</a>
        </div>
    </div>
</section>

<footer>

    </div>
